# Blueprint do Render: cria o backend, o cron do radar e o banco PostgreSQL de uma vez.
services:
  - type: web
    name: certame-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/saude
    disk:
      name: arquivos
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: certame-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PORTAL_TRANSPARENCIA_KEY
        sync: false
      # Cobrança (Mercado Pago)
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://app.kasiski.com.br
      - key: SITE_URL
        value: https://kasiski.com.br
      - key: BACKEND_URL
        sync: false
      - key: ANUAL_MESES_PAGOS
        value: "10"
      - key: CARENCIA_DIAS
        value: "3"
      - key: USD_BRL
        value: "5.5"
      # E-mail (Resend) e verificação no cadastro
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        value: Kasiski <nao-responda@kasiski.com.br>
      - key: VERIFICAR_EMAIL
        value: auto
      # Ferramentas gratuitas do site (limites anti-abuso e custo de IA)
      - key: PUBLICO_ANALISES_DIA
        value: "40"
      - key: PUBLICO_ANALISES_IP_DIA
        value: "2"
      - key: TURNSTILE_SECRET
        sync: false
      # Automações de e-mail (onboarding e fim do teste)
      - key: AUTOMACOES_ATIVAS
        value: sim

  - type: cron
    name: certame-radar
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "0 9 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python jobs/radar_diario.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: certame-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        sync: false
      - key: FRONTEND_URL
        value: https://app.kasiski.com.br
      - key: SITE_URL
        value: https://kasiski.com.br
      - key: BACKEND_URL
        sync: false

databases:
  - name: certame-db
    plan: basic-256mb
