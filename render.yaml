# Blueprint do Render: cria o backend, o cron do radar e o banco PostgreSQL de uma vez.
services:
  - type: web
    name: certame-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/saude
    disk:
      name: arquivos
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: certame-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PORTAL_TRANSPARENCIA_KEY
        sync: false

  - type: cron
    name: certame-radar
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "0 9 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python jobs/radar_diario.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: certame-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: certame-db
    plan: basic-256mb
